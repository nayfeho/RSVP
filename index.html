  function levenshtein(a, b) {
    const matrix = Array.from({ length: b.length + 1 }, () => []);

    for (let i = 0; i <= b.length; i++) matrix[i][0] = i;
    for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

    for (let i = 1; i <= b.length; i++) {
      for (let j = 1; j <= a.length; j++) {
        matrix[i][j] =
          b[i - 1] === a[j - 1]
            ? matrix[i - 1][j - 1]
            : Math.min(
                matrix[i - 1][j - 1] + 1,
                matrix[i][j - 1] + 1,
                matrix[i - 1][j] + 1
              );
      }
    }

    return matrix[b.length][a.length];
  }

  function search(query) {
    query = query.toLowerCase().trim();

    // RESET UI
    result.style.display = "none";
    notFound.style.display = "none";
    suggestions.style.display = "none";
    suggestions.innerHTML = "";

    // NOTHING TYPED → show nothing
    if (!query) return;

    let matches = guests.filter(g =>
      g.name.toLowerCase().includes(query)
    );

    if (matches.length === 0) {
      matches = guests.filter(g =>
        levenshtein(query, g.name.toLowerCase()) <= 4
      );
    }

    if (matches.length === 0) {
      notFound.style.display = "block";
      return;
    }

    suggestions.style.display = "flex";

    matches.forEach(g => {
      const div = document.createElement("div");
      div.className = "suggestion-item";
      div.innerHTML = `<strong>${g.name}</strong> — Table ${g.table}`;

      div.onclick = () => {
        searchInput.value = g.name;
        showResult(g);
      };

      suggestions.appendChild(div);
    });

    // auto show top match
    showResult(matches[0]);
  }

  function showResult(g) {
    guestName.textContent = g.name;
    tableNumber.textContent = g.table;
    result.style.display = "block";
  }

  searchInput.addEventListener("input", (e) => {
    search(e.target.value);
  });
